<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F6F7F9"/>
<text x="851.898" y="140" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#08786C">HOW IT WORKS</text>
<text x="459.902" y="215" font-family="Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#101828">Every install goes through the gate</text>
<rect x="106" y="300" width="658" height="320" rx="28" fill="#E6EAF0" stroke="#D9DEE7" stroke-width="2"/>
<rect x="826" y="300" width="988" height="320" rx="28" fill="#E6EAF0" stroke="#D9DEE7" stroke-width="2"/>
<text x="130.000" y="345" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#5E687B">YOUR MACHINE</text>
<text x="850.000" y="345" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#5E687B">BAWABU SERVICE · MODAL</text>
<rect x="130" y="370" width="280" height="220" rx="22" fill="#FFFFFF" stroke="#5E687B" stroke-width="3"/>
<text x="184.656" y="432" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#101828">Muse Code</text>
<text x="190.086" y="477" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#5E687B">AI coding agent</text>
<text x="193.309" y="510" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#5E687B">starts an install</text>
<text x="176.055" y="562" font-family="Menlo, monospace" font-size="24" font-weight="700" fill="#101828">npm install x</text>
<rect x="460" y="370" width="280" height="220" rx="22" fill="#FFFFFF" stroke="#08786C" stroke-width="3"/>
<text x="495.992" y="432" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#101828">Bawabu hook</text>
<text x="517.547" y="477" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#5E687B">stops the install,</text>
<text x="517.559" y="510" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#5E687B">asks the service</text>
<text x="512.266" y="562" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#08786C">name + version</text>
<rect x="850" y="370" width="280" height="220" rx="22" fill="#FFFFFF" stroke="#08786C" stroke-width="3"/>
<text x="886.828" y="432" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#101828">Quick checks</text>
<text x="906.922" y="477" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#5E687B">known malware,</text>
<text x="906.914" y="510" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#5E687B">made-up names</text>
<text x="937.309" y="562" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#08786C">about 1 s</text>
<rect x="1180" y="370" width="280" height="220" rx="22" fill="#FFFFFF" stroke="#6941C6" stroke-width="3"/>
<text x="1251.508" y="432" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#101828">Screener</text>
<text x="1227.324" y="477" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#5E687B">Muse Spark Open</text>
<text x="1244.582" y="510" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#5E687B">(open weights)</text>
<text x="1237.945" y="562" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#6941C6">a few seconds</text>
<rect x="1510" y="370" width="280" height="220" rx="22" fill="#FFFFFF" stroke="#B42318" stroke-width="3"/>
<text x="1551.320" y="432" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#101828">Investigation</text>
<text x="1570.094" y="477" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#5E687B">locked sandbox</text>
<text x="1578.738" y="510" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#5E687B">+ Muse Spark</text>
<text x="1606.609" y="562" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#B42318">30–90 s</text>
<polyline points="410,480 442,480" fill="none" stroke="#5E687B" stroke-width="4" stroke-linejoin="round"/>
<polygon points="460,480 442,490 442,470" fill="#5E687B"/>
<polyline points="740,480 832,480" fill="none" stroke="#5E687B" stroke-width="4" stroke-linejoin="round"/>
<polygon points="850,480 832,490 832,470" fill="#5E687B"/>
<polyline points="1130,480 1162,480" fill="none" stroke="#5E687B" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1180,480 1162,490 1162,470" fill="#5E687B"/>
<polyline points="1460,480 1492,480" fill="none" stroke="#5E687B" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1510,480 1492,490 1492,470" fill="#5E687B"/>
<path d="M990 590V770" stroke="#08786C" stroke-width="4"/>
<rect x="894.625" y="657.2" width="190.75" height="45.59999999999991" rx="24" fill="#E4F7F3" stroke="#08786C" stroke-width="2"/>
<text x="918.625" y="688.64" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#08786C">allow · block</text>
<path d="M1320 590V770" stroke="#6941C6" stroke-width="4"/>
<rect x="1265.984375" y="657.2" width="108.03125" height="45.59999999999991" rx="24" fill="#F0EAFC" stroke="#6941C6" stroke-width="2"/>
<text x="1289.984" y="688.64" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#6941C6">allow</text>
<path d="M1650 590V770" stroke="#B42318" stroke-width="4"/>
<rect x="1524.58984375" y="657.2" width="250.8203125" height="45.59999999999991" rx="24" fill="#FEE4E2" stroke="#B42318" stroke-width="2"/>
<text x="1548.590" y="688.64" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#B42318">allow · block · ask</text>
<polyline points="1650,770 600,770 600,608" fill="none" stroke="#08786C" stroke-width="4" stroke-linejoin="round"/>
<polygon points="600,590 610,608 590,608" fill="#08786C"/>
<text x="690.738" y="822" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#101828">the answer goes back to the agent, with the evidence and a report link</text>
<text x="472.188" y="955" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#5E687B">Most packages are cleared by the quick checks. Only red flags go further.</text></svg>
