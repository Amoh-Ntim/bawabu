[project]
name = "bawabu"
version = "0.1.0"
description = "Python parts of Bawabu: service, sandbox, eval."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "modal>=1.0",
    "openai>=1.40",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
pythonpath = ["service"]
testpaths = ["service/tests"]
